plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   // kotlin plugin (new id)
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.media_sorter"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.example.media_sorter"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

flutter { source = "../.." }

dependencies {
    // Kotlin stdlib is added by the plugin; keep empty unless you need extras
}
