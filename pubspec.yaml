name: taxtrail
description: A simple media sorter demo
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  path_provider: ^2.1.4
  share_plus: ^7.2.1
  intl: ^0.18.1
  permission_handler: ^11.3.0
  open_file: ^3.3.2
  csv: ^5.1.1
  shared_preferences: ^2.2.2
  screenshot: ^3.0.0
  purchases_flutter: ^9.9.9
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.jpg  

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"